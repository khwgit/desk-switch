name: desk_switch
description: "A cross-platform KVM (Keyboard, Video, Mouse) switch application, built with Flutter. Allows users to control multiple computers using a single keyboard, mouse, and monitor setup."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.1
  flutter: ">=3.32.0"

platforms:
  macos:
  windows:

workspace:
  - packages/go_router_maker
  - packages/kvm_helper

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management and UI
  hooks_riverpod: ^3.0.0-dev.16
  flutter_hooks:
  go_router: ^16.0.0
  go_router_maker: ^0.0.1
  gap: ^3.0.1

  # Code generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  riverpod_annotation: ^3.0.0-dev.16

  # Platform-specific functionality
  window_manager: ^0.5.0
  # desktop_window: ^0.4.2
  # permission_handler: ^12.0.1
  device_info_plus: ^11.5.0
  platform: ^3.1.6
  protobuf: ^4.1.0

  # Utilities
  shared_preferences: ^2.5.3
  logger: ^2.6.0
  path_provider: ^2.1.5
  uuid: ^4.5.1
  intl: ^0.20.2
  package_info_plus: ^8.3.0
  collection: ^1.19.1
  bonsoir: ^5.1.11
  kvm_helper: ^0.0.1
  # cassowary: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  custom_lint:
  riverpod_lint: ^3.0.0-dev.16
  build_runner: ^2.5.4
  mockito: ^5.4.6
  freezed: ^3.1.0
  json_serializable: ^6.9.5
  riverpod_generator: ^3.0.0-dev.16
  melos: ^7.0.0-dev.9

flutter:
  uses-material-design: true
  generate: true

  # assets:
  #   - assets/images/
  #   - assets/icons/
melos:
  scripts:
    analyze:
      run: melos exec -c 1 -- "dart analyze ."
      description: Analyze all packages

    build:
      run: melos exec -c 1 -- "dart run build_runner build --delete-conflicting-outputs"
      description: Generate all packages

    format:
      run: melos exec -c 1 -- "dart format ."
      description: Format all packages

    test:
      run: melos exec -c 1 -- "dart test"
      description: Test all packages
