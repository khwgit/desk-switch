name: kvm_helper
description: "A new Flutter plugin project."
version: 0.0.1
resolution: workspace

environment:
  sdk: ^3.8.1
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.1.0
  json_serializable: ^6.9.5
  build_runner: ^2.5.4

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: KvmHelperPlugin
      macos:
        pluginClass: KvmHelperPlugin
      windows:
        pluginClass: KvmHelperPluginCApi
